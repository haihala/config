# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# This prevents some odd characters from showing up when starting up
set -sg escape-time 50

# This is for image.nvim
set -gq allow-passthrough on

# Set name to path
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# These fix colors in neovim
set-option -gas terminal-overrides "*:Tc" # true color support
set-option -gas terminal-overrides "*:RGB" # true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Create new session (c without ctrl is new window)
bind C-c new-session

# When a session is destroyed (eg. ctrl-d out of its last pane), move to the
# most recently active remaining session instead of dropping out of tmux.
# Note 'previous'/'next' are alphabetical, not most-recently-used, so 'off' is
# the one that behaves like prefix + L.
set -g detach-on-destroy off

# Promote the current window into a session of its own.
# prefix + ! does this one level down (pane -> window).
# display-popup does not expand #{...} in shell-command, so the script
# resolves the window and client itself.
bind S display-popup -E -w 60 -h 8 -T " window -> new session " "$HOME/bin/tmux-promote-window"

# Grapple-style session marks.
# These use Alt+<number> rather than Ctrl+<number>: Ctrl+digit has no legacy
# terminal encoding, and the only way to get it is an extended key protocol.
# tmux 3.8 speaks only xterm's modifyOtherKeys (CSI >4;2m), which kitty
# deliberately does not implement - see "Why xterm's modifyOtherKeys should not
# be used" in the kitty keyboard protocol docs. kitty implements only its own
# CSI u protocol, which tmux does not emit. So Ctrl+digit simply cannot arrive.
# Alt+<number> is plain ESC + digit and needs no negotiation anywhere.
# This overrides the default select-layout presets on M-1..M-4 (M-5 is kept).
bind M-1 run-shell "$HOME/bin/tmux-session-mark go 1 '#{client_tty}'"
bind M-2 run-shell "$HOME/bin/tmux-session-mark go 2 '#{client_tty}'"
bind M-3 run-shell "$HOME/bin/tmux-session-mark go 3 '#{client_tty}'"
bind M-4 run-shell "$HOME/bin/tmux-session-mark go 4 '#{client_tty}'"
bind G run-shell "$HOME/bin/tmux-session-mark menu '#{client_tty}'"

# Start a new task: pick a repo, create a worktree, session and agent.
# The agent command comes from $HARNESS (defaults to opencode).
# -d is needed to scan from the pane's directory: a popup otherwise starts in
# the session's directory. Note -d expands #{...} even though shell-command
# does not.
bind a display-popup -E -d "#{pane_current_path}" -w 80% -h 70% -T " new task " "$HOME/bin/tmux-new-task"

# Fuzzy session switcher, ordered by most recently used.
# prefix + s is choose-tree, this is the fzf equivalent.
bind j display-popup -E -w 70% -h 60% -T " sessions " "$HOME/bin/tmux-session-switch"

# Rename session with current folder name
bind r rename-session "#{b:pane_current_path}" \; display "renamed session to folder name"
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded config"

# switch panes using Alt-arrow (or vim equivalent) without prefix
bind -n M-Left run-shell 'tmux-vim-select-pane -L'
bind -n M-h run-shell 'tmux-vim-select-pane -L'

bind -n M-Right run-shell 'tmux-vim-select-pane -R'
bind -n M-l run-shell 'tmux-vim-select-pane -R'

bind -n M-Up run-shell 'tmux-vim-select-pane -U'
bind -n M-k run-shell 'tmux-vim-select-pane -U'

bind -n M-Down run-shell 'tmux-vim-select-pane -D'
bind -n M-j run-shell 'tmux-vim-select-pane -D'

set -g mouse on

# Start indexes from 1 (for easier navigation)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

setw -g mode-keys vi

# Bell off
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @dracula-plugins "git cpu-usage ram-usage battery weather time"
set -g @dracula-show-fahrenheit false
set -g @dracula-time-format "%F %R"
set -g @plugin 'dracula/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
